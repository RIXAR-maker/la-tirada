<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="La Tirada">
  <defs>
    <g id="bola">
      <circle r="17" fill="#0E2A6B"/>
      <path d="M-16.4 -4.5 Q0 1 16.4 -4.5 M-15.2 1.8 Q0 7.3 15.2 1.8 M-12.6 8 Q0 13 12.6 8" fill="none" stroke="#F7C600" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="120" height="120" rx="28" fill="#F7C600"/>
  <!-- estela de la tirada -->
  <g stroke="#0E2A6B" stroke-width="4.5" stroke-linecap="round">
    <line x1="12" y1="12" x2="24" y2="24"/>
    <line x1="9" y1="30" x2="18" y2="39"/>
    <line x1="27" y1="9" x2="36" y2="18"/>
  </g>
  <use href="#bola" transform="translate(40 40) rotate(-35)"/>
  <!-- bolas en reposo junto al boliche -->
  <use href="#bola" transform="translate(56 84) rotate(10)"/>
  <use href="#bola" transform="translate(92 72) rotate(-15) scale(.9)"/>
  <!-- boliche -->
  <circle cx="84" cy="100" r="7" fill="#E2462B"/>
</svg>
